<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asteroide B-612</title>
    <link rel="stylesheet" href="style.css?v=5">
    <script src="src/main.js?v=5" type="module"></script>
  </head>
  <body>
    <main>
      <canvas id="scene" aria-label="Diorama tridimensional do asteroide B-612"></canvas>
      <header>
        <p>O Pequeno Príncipe</p>
        <h1>Asteroide B-612</h1>
        <p>Pressione P para mudar a pose do príncipe</p>
      </header>
      <aside class="controls">
        <span id="camera-mode" role="status">Câmera automática</span>
        <span>1 · Automática &nbsp; 2 · Orbital &nbsp; Scroll · Zoom &nbsp; <span id="light-mode" role="status">L · Luz ligada</span></span>
        <button type="button" id="music-toggle" aria-pressed="false">Música de fundo</button>
      </aside>
      <p id="status" role="status" hidden></p>
    </main>
  </body>
</html>
